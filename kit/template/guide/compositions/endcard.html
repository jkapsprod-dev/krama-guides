<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>End card (3 s): Krama Events and krama.events/help</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .end-stage {
          position: absolute;
          inset: 0;
          font-family: var(--k-sans);
          color: var(--k-ivory);
        }
        .end-lockup {
          position: absolute;
          left: 0;
          top: 0;
        }
        .end-thread {
          position: absolute;
          left: 0;
          top: 0;
          overflow: visible;
        }
        .end-url {
          position: absolute;
          left: 5%;
          right: 5%;
          margin: 0;
          text-align: center;
          font-family: var(--k-sans);
          font-weight: 600;
          letter-spacing: 0.02em;
          color: var(--k-ivory);
        }
      </style>

      <div id="root" data-composition-id="endcard">
        <div class="end-stage" id="endcard-stage">
          <svg class="end-thread" id="endcard-thread" aria-hidden="true"></svg>
          <div class="end-lockup k-lockup" id="endcard-lockup"></div>
          <p class="end-url" id="endcard-url"></p>
        </div>

        <script>
          (function () {
            const B = window.KramaBrand;
            const V = B.vars();
            const P = B.portrait();
            const W = P ? 1080 : 1920;
            const H = P ? 1920 : 1080;

            function build() {
              const tl = gsap.timeline({ paused: true });
              const lockEl = document.getElementById("endcard-lockup");
              const lock = B.lockup(lockEl, V.brandName);
              const s = P ? 0.62 : 0.72;
              const cx = W / 2;
              const cy = P ? 860 : 440;
              const width = lockEl.offsetWidth;

              // The lockup settles in the centre: the mark draws, the wordmark catches the light.
              tl.fromTo(
                lockEl,
                { x: cx, y: cy, xPercent: -50, yPercent: -50, scale: s * 0.94, opacity: 0 },
                { scale: s, opacity: 1, duration: 0.7, ease: "expo.out" },
                0.12,
              );
              tl.fromTo(lock.strokes, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", stagger: 0.05 }, 0.15);
              tl.fromTo(lock.word, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.3, ease: "power1.inOut" }, 0.55);

              // The gold thread under it, and the help address.
              const svg = document.getElementById("endcard-thread");
              svg.setAttribute("width", W);
              svg.setAttribute("height", H);
              svg.setAttribute("viewBox", "0 0 " + W + " " + H);
              const ty = cy + (P ? 130 : 120);
              const half = Math.min(W * 0.36, (width * s) / 2 + 80);
              const thread = B.thread(svg, cx - half, cx + half, ty, 0);
              thread.draw(tl, 0.35, 0.9, "power2.inOut");
              thread.sweep(tl, 1.2, 1.0);

              const url = document.getElementById("endcard-url");
              url.textContent = V.helpUrl;
              const size = P ? 46 : 40;
              url.style.fontSize = size + "px";
              url.style.top = ty + (P ? 70 : 56) + "px";
              tl.fromTo(url, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, 0.8);

              window.__timelines = window.__timelines || {};
              window.__timelines["endcard"] = tl;
            }

            document.fonts.load('600 124px "Cormorant Garamond"', V.brandName || "Krama Events").then(build, build);
          })();
        </script>
      </div>
    </template>
  </body>
</html>
