<!doctype html>
<!-- Krama guide video. Built by kit/lib/build.mjs from kit/template/guide/index.html.
     Edit the template, not this file: `npm run make` writes it again. -->
<html
  lang="en"
  data-resolution="%%RESOLUTION%%"
  data-composition-variables='%%VARIABLES%%'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=%%W%%, height=%%H%%" />
    <title>%%TITLE%%</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/brand.css" />
    <script src="shared/brand.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #12100e;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--k-ink);
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      /* One ink ground under everything, with a soft warm light, as in the launch film. */
      #k-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(120% 90% at 50% 38%, rgb(255 236 200 / 0.055), rgb(255 236 200 / 0) 62%),
          var(--k-ink);
      }
      #k-grain {
        z-index: 1;
      }
      /* The app's screen: a rounded card. The camera inside it does the gentle zooms. */
      #screen {
        position: absolute;
        z-index: 2;
        overflow: hidden;
        background: #fbf7f1;
        border: 1px solid rgb(212 176 106 / 0.38);
        box-shadow:
          0 44px 80px -36px rgb(0 0 0 / 0.75),
          0 12px 24px -16px rgb(0 0 0 / 0.5);
        opacity: 0;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
      }
      #footage,
      #hold {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* Soft highlight ring around what the robot taps. */
      .ring {
        position: absolute;
        border: 3px solid var(--k-gold);
        box-shadow:
          0 0 0 7px rgb(212 176 106 / 0.16),
          0 0 26px 2px rgb(212 176 106 / 0.5);
        background: rgb(212 176 106 / 0.06);
        opacity: 0;
        pointer-events: none;
      }
      /* Phone only: where you are, above the screen. */
      #eyebrow {
        position: absolute;
        z-index: 3;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        font-family: var(--k-sans);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--k-gold);
        opacity: 0;
      }
      /* The gold thread under the captions shows how far through the steps we are. */
      #progress {
        position: absolute;
        z-index: 3;
        left: 0;
        top: 0;
        overflow: visible;
        opacity: 0;
      }
      #progress .track {
        stroke: var(--k-gold);
        stroke-opacity: 0.2;
        stroke-width: 2;
        fill: none;
      }
      #progress .knot {
        fill: var(--k-muted);
        fill-opacity: 0.45;
      }
      #progress .knot.on {
        fill: var(--k-gold);
        fill-opacity: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="%%DURATION%%"
      data-fps="30"
      data-width="%%W%%"
      data-height="%%H%%"
    >
      <div id="k-bg"></div>
      <div id="k-grain" class="k-grain"></div>

      <div id="screen">
        <div id="cam" data-layout-allow-overflow>
          <video
            id="footage"
            class="clip"
            src="assets/footage.mp4"
            data-start="%%FOOT_START%%"
            data-duration="%%FOOT_DURATION%%"
            data-track-index="1"
            muted
            playsinline
          ></video>
%%HOLD%%
%%RINGS%%
        </div>
      </div>

      <p id="eyebrow" data-var-text="sectionName">%%SECTION_ASCII%%</p>
      <svg id="progress" aria-hidden="true"></svg>

      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="%%INTRO%%"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="%%W%%"
        data-height="%%H%%"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="%%FOOT_START%%"
        data-duration="%%SHOW_DURATION%%"
        data-track-index="3"
        data-track-kind="captions"
        data-width="%%W%%"
        data-height="%%H%%"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="%%END_START%%"
        data-duration="%%END%%"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="%%W%%"
        data-height="%%H%%"
      ></div>

      <!-- Sound: the music bed (already turned down under the voice) and one voice line per step,
           each at the start of its step. -->
      <audio
        id="music"
        src="assets/music-bed.wav"
        data-start="0"
        data-duration="%%DURATION%%"
        data-track-index="10"
        data-volume="1"
      ></audio>
%%VOICES%%
    </div>

    <script>
      (function () {
        const B = window.KramaBrand;
        const D = %%DATA%%;
        const tl = gsap.timeline({ paused: true });
        const screen = document.getElementById("screen");
        const cam = document.getElementById("cam");

        // Layout (numbers come from the kit, one set per size).
        const c = D.card;
        Object.assign(screen.style, {
          left: c.x + "px",
          top: c.y + "px",
          width: c.w + "px",
          height: c.h + "px",
          borderRadius: c.r + "px",
        });

        // Grain on the ink ground for the whole video.
        B.grain(tl, document.getElementById("k-grain"), D.duration, 30);

        // The screen arrives as the intro title leaves, and leaves for the end card.
        tl.fromTo(screen, { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, D.footStart - 0.15);
        tl.to(screen, { opacity: 0, scale: 0.99, duration: 0.45, ease: "power2.in" }, D.footEnd - 0.45);

        // Camera: gentle moves onto each tapped element, worked out by the kit from the robot's JSON.
        tl.set(cam, { x: 0, y: 0, scale: 1 }, 0);
        D.camera.forEach(function (m) {
          tl.to(cam, { x: m.x, y: m.y, scale: m.s, duration: m.dur, ease: "power2.inOut" }, m.at);
        });

        // Highlight rings.
        D.rings.forEach(function (r) {
          const el = document.getElementById(r.id);
          tl.fromTo(el, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, r.in);
          tl.to(el, { opacity: 0, duration: 0.25, ease: "power2.in" }, r.out);
        });

        // Phone: the section name above the screen.
        const eyebrow = document.getElementById("eyebrow");
        if (D.eyebrow) {
          eyebrow.style.top = D.eyebrow.y + "px";
          eyebrow.style.fontSize = D.eyebrow.size + "px";
          tl.fromTo(eyebrow, { opacity: 0 }, { opacity: 0.9, duration: 0.6, ease: "power1.out" }, D.footStart + 0.2);
          tl.to(eyebrow, { opacity: 0, duration: 0.35, ease: "power2.in" }, D.footEnd - 0.45);
        }

        // Progress thread: a faint track, a gold line that grows step by step, a knot per step.
        const P = D.progress;
        const svg = document.getElementById("progress");
        svg.setAttribute("width", D.W);
        svg.setAttribute("height", D.H);
        svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
        const track = B.s("path", { class: "track", d: "M" + P.x0 + " " + P.y + " L" + P.x1 + " " + P.y });
        svg.appendChild(track);
        const gold = B.thread(svg, P.x0, P.x1, P.y, 0);
        P.knots.forEach(function (k, i) {
          const dot = B.s("circle", { class: "knot", cx: k.x, cy: P.y, r: P.knotR });
          svg.appendChild(dot);
          tl.set(dot, { attr: { class: "knot on" } }, k.at);
        });
        tl.fromTo(svg, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, D.footStart + 0.1);
        tl.set(gold.drawn, { strokeDashoffset: 1 }, 0);
        P.knots.forEach(function (k) {
          tl.to(gold.drawn, { strokeDashoffset: 1 - k.frac, duration: 0.7, ease: "power2.inOut" }, k.at);
        });
        tl.to(svg, { opacity: 0, duration: 0.35, ease: "power2.in" }, D.footEnd - 0.45);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
