<!doctype html>
<!-- Krama section intro (6 s). Built by kit/bin/intro.mjs from kit/template/section/index.html.
     Edit the template, not this file: `npm run intro` writes it again. -->
<html
  lang="en"
  data-resolution="%%RESOLUTION%%"
  data-composition-variables='%%VARIABLES%%'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=%%W%%, height=%%H%%" />
    <title>%%TITLE%%</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/brand.css" />
    <script src="shared/brand.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #12100e;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--k-ink);
        font-family: var(--k-sans);
        color: var(--k-ivory);
      }
      #k-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(110% 80% at 50% 42%, rgb(255 236 200 / 0.07), rgb(255 236 200 / 0) 60%),
          var(--k-ink);
      }
      #k-light {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(60% 45% at 50% 44%, rgb(212 176 106 / 0.16), rgb(212 176 106 / 0) 70%);
        opacity: 0;
      }
      #k-grain {
        z-index: 1;
      }
      #dust {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      .mote {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        background: var(--k-gold);
        opacity: 0;
      }
      #thread {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 2;
        overflow: visible;
      }
      /* Mark, eyebrow and name stand in one column that sits on the thread and grows upward,
         so a name on two lines never runs into it. */
      #stack {
        position: absolute;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #mark {
        flex: none;
      }
      #mark .k-mark {
        width: 100%;
        height: 100%;
      }
      #mark .k-mark-stroke {
        stroke-width: 1.2;
      }
      #eyebrow {
        margin: 0;
        text-align: center;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--k-gold);
        opacity: 0;
      }
      #name {
        margin: 0;
        width: 100%;
        text-align: center;
        font-family: var(--k-heading);
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      #name .k-w,
      #line .k-w {
        display: inline-block;
        opacity: 0;
      }
      #name .k-w-em {
        font-style: italic;
        font-weight: 500;
        color: var(--k-gold);
      }
      #line {
        position: absolute;
        z-index: 3;
        left: 10%;
        right: 10%;
        margin: 0;
        text-align: center;
        font-weight: 500;
        line-height: 1.35;
        color: var(--k-muted);
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="%%DURATION%%"
      data-fps="30"
      data-width="%%W%%"
      data-height="%%H%%"
    >
      <div id="k-bg"></div>
      <div id="k-light"></div>
      <div id="k-grain" class="k-grain"></div>
      <div id="dust" aria-hidden="true"></div>
      <svg id="thread" aria-hidden="true"></svg>
      <div id="stack">
        <div id="mark"></div>
        <p id="eyebrow" data-var-text="eyebrow">Krama guides</p>
        <h1 id="name"></h1>
      </div>
      <p id="line"></p>

      <audio id="music" src="assets/music-bed.wav" data-start="0" data-duration="%%DURATION%%" data-track-index="10" data-volume="1"></audio>
%%VOICES%%
    </div>

    <script>
      (function () {
        const B = window.KramaBrand;
        const V = B.vars();
        const D = %%DATA%%;
        const P = B.portrait();
        const W = D.W;
        const H = D.H;

        function build() {
          const tl = gsap.timeline({ paused: true });
          B.grain(tl, document.getElementById("k-grain"), D.duration, 30);

          // Sizes and places. The thread is at a fixed height; the stack stands on it.
          const nameSize = P ? 124 : 132;
          const lineSize = P ? 46 : 40;
          const markSize = P ? 150 : 128;
          const ty = P ? 1010 : 600;

          const stack = document.getElementById("stack");
          stack.style.left = W * 0.06 + "px";
          stack.style.width = W * 0.88 + "px";
          stack.style.bottom = H - ty + (P ? 64 : 50) + "px";
          const line = document.getElementById("line");
          line.style.left = W * 0.1 + "px";
          line.style.right = "auto";
          line.style.width = W * 0.8 + "px";

          // A slow warm light comes up behind everything.
          tl.fromTo("#k-light", { opacity: 0 }, { opacity: 1, duration: 2.4, ease: "power1.inOut" }, 0);

          // The mark draws itself, then turns very slowly for the rest of the intro.
          const markEl = document.getElementById("mark");
          markEl.style.width = markSize + "px";
          markEl.style.height = markSize + "px";
          markEl.style.marginBottom = (P ? 54 : 40) + "px";
          const m = B.mark();
          markEl.appendChild(m);
          const strokes = m.querySelectorAll(".k-mark-stroke");
          tl.fromTo(strokes, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out", stagger: 0.08 }, 0.1);
          tl.fromTo(markEl, { rotation: -12, scale: 0.9, opacity: 0 }, { rotation: 0, scale: 1, opacity: 1, duration: 1.2, ease: "expo.out" }, 0.1);
          tl.to(markEl, { rotation: 14, duration: D.duration - 1.3, ease: "none" }, 1.3);

          // Eyebrow, then the section name word by word (from 0.5 s).
          const eyebrow = document.getElementById("eyebrow");
          eyebrow.style.fontSize = (P ? 28 : 24) + "px";
          eyebrow.style.marginBottom = (P ? 30 : 22) + "px";
          tl.fromTo(eyebrow, { opacity: 0, filter: "blur(6px)" }, { opacity: 0.95, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.35);

          const name = document.getElementById("name");
          name.style.fontSize = nameSize + "px";
          const nameWords = B.words(name, String(V.sectionName).replace(/\s&\s/g, " *&* "));
          nameWords.forEach(function (w, i) {
            tl.fromTo(w, { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.5 + i * 0.12);
          });

          // The gold thread sweeps across under the name and a glint runs along it.
          const svg = document.getElementById("thread");
          svg.setAttribute("width", W);
          svg.setAttribute("height", H);
          svg.setAttribute("viewBox", "0 0 " + W + " " + H);
          const thread = B.thread(svg, -40, W + 40, ty, P ? 22 : 26);
          thread.draw(tl, 0.7, 1.4, "power2.inOut");
          thread.sweep(tl, 2.0, 1.6);
          thread.sweep(tl, 4.3, 1.4);

          // The one line, from 2 s, word by word.
          line.style.fontSize = lineSize + "px";
          line.style.top = ty + (P ? 64 : 48) + "px";
          const lineWords = B.words(line, V.line);
          lineWords.forEach(function (w, i) {
            tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 2.0 + i * 0.08);
          });

          // A little gold dust rising, seeded so every render is the same.
          const dust = document.getElementById("dust");
          let seed = 7211;
          const rnd = function () {
            seed = (seed * 1664525 + 1013904223) % 4294967296;
            return seed / 4294967296;
          };
          for (let i = 0; i < 22; i++) {
            const d = B.h("div", { class: "mote" });
            const size = 3 + rnd() * 5;
            d.style.width = size + "px";
            d.style.height = size + "px";
            dust.appendChild(d);
            const x = W * (0.08 + rnd() * 0.84);
            const y0 = H * (0.55 + rnd() * 0.4);
            const start = 0.3 + rnd() * 2.2;
            const life = D.duration - start;
            tl.fromTo(d, { x: x, y: y0, opacity: 0 }, { x: x + (rnd() - 0.5) * 60, y: y0 - H * (0.12 + rnd() * 0.18), duration: life, ease: "none" }, start);
            tl.fromTo(d, { opacity: 0 }, { opacity: 0.25 + rnd() * 0.45, duration: 0.8, ease: "power1.out", immediateRender: false }, start);
            tl.to(d, { opacity: 0, duration: 0.8, ease: "power1.in" }, D.duration - 0.9);
          }

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        }

        document.fonts.load('600 124px "Cormorant Garamond"', V.sectionName || "Guests").then(build, build);
      })();
    </script>
  </body>
</html>
